name: Build Android APK & Deploy ReLec Website

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Android APK (Auto CI/CD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify Generated APK
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Fresh APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fresh-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  deploy-pages:
    name: Deploy Web App & APK Downloads to GitHub Pages
    needs: [build-apk]
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Fresh Built APK (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fresh-android-apk
          path: ./fresh-apk

      - name: Sync Fresh APK to Web Downloads & Version Manifest
        run: |
          mkdir -p ./web/public/downloads
          if [ -f "./fresh-apk/app-debug.apk" ]; then
            echo "Successfully placing freshly compiled APK into web downloads!"
            cp -f ./fresh-apk/app-debug.apk ./web/public/downloads/relec-pro-erp.apk
            cp -f ./fresh-apk/app-debug.apk ./web/public/downloads/revolt-erp.apk
          else
            echo "Fresh APK artifact was not found; preserving existing download."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Web Application (Includes APK & version.json)
        working-directory: ./web
        run: npm run build

      - name: Verify Web Dist Content
        run: |
          ls -la ./web/dist/
          ls -la ./web/dist/downloads/ || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
